<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monitor Wall - AI CCTV</title>
    <link rel="stylesheet" href="app.css?v=20260926-5">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            color: #f1f5f9;
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .wall-navbar {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .wall-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .wall-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
        }

        .wall-title span {
            color: #38bdf8;
            font-weight: 900;
        }

        .live-pulse-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
            font-size: 0.72rem;
            font-weight: 800;
            border-radius: 999px;
            letter-spacing: 0.04em;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulseDot 1.4s ease-in-out infinite alternate;
        }

        @keyframes pulseDot {
            from { transform: scale(0.85); opacity: 0.6; }
            to { transform: scale(1.3); opacity: 1; }
        }

        .wall-clock {
            font-family: monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: #94a3b8;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .wall-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .wall-filter-group, .wall-grid-switch {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            gap: 2px;
        }

        .wall-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .wall-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .wall-btn.active {
            background: #38bdf8;
            color: #0f172a;
            font-weight: 800;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .wall-col-btn {
            padding: 4px 10px;
            min-width: 28px;
            justify-content: center;
        }

        .wall-container {
            flex: 1;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .wall-stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
        }

        .wall-stats-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .wall-stats-pill {
            background: rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 999px;
            color: #f1f5f9;
            font-weight: 700;
        }

        .wall-grid {
            display: grid;
            gap: 16px;
            width: 100%;
        }

        .wall-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .wall-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .wall-grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .wall-grid.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

        @media (max-width: 1400px) {
            .wall-grid.cols-5 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        @media (max-width: 1100px) {
            .wall-grid.cols-5, .wall-grid.cols-4 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 800px) {
            .wall-grid.cols-5, .wall-grid.cols-4, .wall-grid.cols-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (max-width: 540px) {
            .wall-grid.cols-5, .wall-grid.cols-4, .wall-grid.cols-3, .wall-grid.cols-2 { grid-template-columns: 1fr; }
        }

        .wall-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .wall-card:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .wall-card.target-alert {
            border-color: rgba(244, 63, 94, 0.6);
            background: rgba(244, 63, 94, 0.09);
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.2);
        }

        .wall-card.target-alert:hover {
            border-color: rgba(244, 63, 94, 0.9);
            box-shadow: 0 8px 32px rgba(244, 63, 94, 0.35);
        }

        .wall-card-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .wall-card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .wall-card-time {
            font-size: 0.75rem;
            color: #94a3b8;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .wall-media-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .wall-media-wrap img.main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
            transition: transform 0.25s ease;
        }

        .wall-media-wrap:hover img.main-img {
            transform: scale(1.03);
        }

        .wall-plate-badge {
            position: absolute;
            right: 8px;
            bottom: 8px;
            background: rgba(15, 23, 42, 0.92);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 5px 8px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            backdrop-filter: blur(4px);
            max-width: 140px;
        }

        .wall-plate-badge img {
            max-height: 44px;
            max-width: 100%;
            object-fit: contain;
            border-radius: 3px;
        }

        .wall-plate-badge span {
            font-size: 0.82rem;
            color: #fff;
            font-weight: 800;
            background: #334155;
            padding: 2px 8px;
            border-radius: 3px;
            white-space: nowrap;
            letter-spacing: 0.02em;
        }

        /* Light Theme Overrides */
        [data-theme="light"] body {
            background: #f1f5f9;
            color: #0f172a;
        }
        [data-theme="light"] .wall-navbar {
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid #e2e8f0;
        }
        [data-theme="light"] .wall-title {
            color: #0f172a;
        }
        [data-theme="light"] .wall-clock {
            background: #e2e8f0;
            color: #475569;
            border-color: #cbd5e1;
        }
        [data-theme="light"] .wall-card {
            background: #ffffff;
            border-color: #e2e8f0;
        }
        [data-theme="light"] .wall-card-title {
            color: #0f172a;
        }
        [data-theme="light"] .wall-stats-bar {
            background: #ffffff;
            border-color: #e2e8f0;
        }
        [data-theme="light"] .wall-filter-group,
        [data-theme="light"] .wall-grid-switch {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }
        [data-theme="light"] .wall-btn {
            color: #475569;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="wall-navbar">
        <div class="wall-brand">
            <a href="index.html" class="wall-btn" style="padding: 6px 10px;" title="กลับหน้าหลัก">
                <i class="ri-arrow-left-line"></i> หน้าหลัก
            </a>
            <div class="wall-title">
                <i class="ri-tv-2-line" style="color: #38bdf8; font-size: 1.4rem;"></i>
                LIVE <span>MONITOR WALL</span>
            </div>
            <span class="live-pulse-badge"><span class="pulse-dot"></span> REAL-TIME</span>
        </div>

        <div class="wall-clock" id="wall-clock">
            <i class="ri-time-line"></i> --:--:--
        </div>

        <div class="wall-actions">
            <!-- Filter Selector -->
            <div class="wall-filter-group">
                <button type="button" class="wall-btn active" data-filter="all" onclick="setWallFilter('all')">ทั้งหมด</button>
                <button type="button" class="wall-btn" data-filter="lpr" onclick="setWallFilter('lpr')"><i class="ri-font-size-2"></i> ทะเบียน</button>
                <button type="button" class="wall-btn" data-filter="target" onclick="setWallFilter('target')"><i class="ri-focus-3-fill"></i> เป้าหมาย</button>
                <button type="button" class="wall-btn" data-filter="person" onclick="setWallFilter('person')"><i class="ri-user-3-fill"></i> บุคคล</button>
                <button type="button" class="wall-btn" data-filter="zone" onclick="setWallFilter('zone')"><i class="ri-map-pin-user-fill"></i> Zone/Line</button>
            </div>

            <!-- Column Grid Switch -->
            <div class="wall-grid-switch">
                <span style="font-size: 0.75rem; color: #94a3b8; margin: 0 4px;">คอลัมน์:</span>
                <button type="button" class="wall-btn wall-col-btn" data-cols="2" onclick="setWallColumns(2)">2</button>
                <button type="button" class="wall-btn wall-col-btn active" data-cols="3" onclick="setWallColumns(3)">3</button>
                <button type="button" class="wall-btn wall-col-btn" data-cols="4" onclick="setWallColumns(4)">4</button>
                <button type="button" class="wall-btn wall-col-btn" data-cols="5" onclick="setWallColumns(5)">5</button>
            </div>

            <!-- Sound & Fullscreen -->
            <button type="button" class="wall-btn" id="sound-btn" onclick="toggleSoundAlert()" title="เปิด/ปิดเสียงเตือนเป้าหมาย">
                <i class="ri-volume-mute-fill" id="sound-icon"></i>
            </button>

            <button type="button" class="wall-btn" onclick="toggleFullScreen()" title="เปิดเต็มหน้าจอ (Fullscreen)">
                <i class="ri-fullscreen-line"></i>
            </button>

            <button type="button" class="theme-toggle-btn" onclick="toggleAppTheme()" id="theme-toggle-btn" title="สลับธีม สว่าง / มืด">
                <span class="theme-toggle-track">
                    <i class="ri-sun-fill theme-icon-sun"></i>
                    <i class="ri-moon-fill theme-icon-moon"></i>
                    <span class="theme-toggle-thumb"></span>
                </span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="wall-container">
        <!-- Stats Summary Bar -->
        <div class="wall-stats-bar">
            <div class="wall-stats-left">
                <span>กำลังแสดงผล: <strong id="wall-count" class="wall-stats-pill">0 รายการ</strong></span>
                <span>สถานะการเชื่อมต่อ: <span id="conn-status" style="color: #10b981; font-weight: 700;"><i class="ri-checkbox-circle-fill"></i> สตรีมสดทำงานปกติ</span></span>
            </div>
            <div style="font-size: 0.8rem; color: #94a3b8; display: flex; align-items: center; gap: 6px;">
                <i class="ri-information-line"></i> คลิกที่ภาพเพื่อดูรายละเอียดหรือภาพขยายขนาดเต็ม
            </div>
        </div>

        <!-- Matrix Grid -->
        <div id="wall-grid" class="wall-grid cols-3">
            <div class="empty-state" style="grid-column: 1 / -1; padding: 100px 20px; text-align: center; color: #94a3b8; font-size: 1.1rem;">
                <i class="ri-radar-line" style="font-size: 3rem; display: block; margin-bottom: 12px; color: #38bdf8;"></i>
                กำลังเชื่อมต่อและรอรับข้อมูลการตรวจจับสด...
            </div>
        </div>
    </main>

    <!-- Image Modal for Zoom -->
    <div id="imageModal" class="modal" onclick="if(event.target === this) closeImageModal()">
        <div class="modal-content glass-card" style="max-width: 900px; padding: 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="modalTitle" style="margin: 0; display: flex; align-items: center; gap: 8px;">
                    <i class="ri-image-line" style="color: var(--primary);"></i> รายละเอียดภาพเหตุการณ์
                </h3>
                <span class="close-modal" onclick="closeImageModal()" style="position: static;">&times;</span>
            </div>
            <div style="text-align: center; background: #000; border-radius: 8px; overflow: hidden; max-height: 75vh;">
                <img id="modalImg" src="" alt="ภาพขยาย" style="max-height: 75vh; max-width: 100%; object-fit: contain;">
            </div>
        </div>
    </div>

    <script>
        const API_URL = `${window.location.protocol}//${window.location.hostname}:8081`;
        let wallHits = [];
        let wallFilter = 'all';
        let wallCols = 3;
        let soundEnabled = false;
        let audioCtx = null;

        // Digital Clock
        function updateClock() {
            const now = new Date();
            const d = now.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: 'numeric' });
            const t = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const el = document.getElementById('wall-clock');
            if (el) el.innerHTML = `<i class="ri-time-line"></i> ${d} ${t}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function safeMediaUrl(path) {
            if (!path) return '';
            if (path.startsWith('http://') || path.startsWith('https://') || path.startsWith('data:')) {
                return path;
            }
            const clean = path.startsWith('/') ? path : `/${path}`;
            return `${API_URL}${clean}`;
        }

        function formatTime(hit) {
            if (!hit) return '';
            if (hit.timestamp) return hit.timestamp;
            if (hit.created_at) {
                const d = new Date(hit.created_at);
                if (!isNaN(d.getTime())) {
                    return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                }
            }
            return new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // Web Audio Synthesizer Beep for Target Alert (Zero dependency)
        function playAlertSound() {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
                osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        function toggleSoundAlert() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const btn = document.getElementById('sound-btn');
            if (soundEnabled) {
                icon.className = 'ri-volume-up-fill';
                icon.style.color = '#38bdf8';
                btn.style.borderColor = '#38bdf8';
                playAlertSound(); // sample play
            } else {
                icon.className = 'ri-volume-mute-fill';
                icon.style.color = '';
                btn.style.borderColor = '';
            }
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function setWallFilter(filter) {
            wallFilter = filter;
            document.querySelectorAll('.wall-filter-group .wall-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderWall();
        }

        function setWallColumns(cols) {
            wallCols = cols;
            document.querySelectorAll('.wall-grid-switch .wall-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.cols) === cols);
            });
            const grid = document.getElementById('wall-grid');
            if (grid) {
                grid.className = `wall-grid cols-${cols}`;
            }
        }

        function matchesFilter(hit, filter) {
            if (filter === 'all') return true;
            const rawName = (hit.name || "").trim();
            const isLpr = rawName.includes("[LPR]") || rawName.startsWith("LPR") || Boolean(hit.plate_img_url || hit.license_plate);
            const isPlateTarget = rawName.includes("ทะเบียนเป้าหมาย") || rawName.includes("💳");
            const isZone = rawName.includes("ในพื้นที่") || rawName.includes("วัตถุต้องสงสัย") || hit.detection_type === "zone_entry" || hit.detection_type === "zone_uncertain";
            const isLine = rawName.includes("ข้ามเส้น") || hit.detection_type === "line_cross";
            const isPerson = rawName.includes("บุคคล") || rawName.toLowerCase().includes("person");
            const isVehicle = rawName.startsWith("รถ") || rawName.startsWith("ยานพาหนะ");

            if (filter === 'lpr') return isLpr;
            if (filter === 'target') {
                return isPlateTarget || (!isLpr && !isZone && !isLine && !isPerson && !isVehicle) || hit.is_target;
            }
            if (filter === 'person') return isPerson;
            if (filter === 'zone') return isZone || isLine;
            return true;
        }

        function renderLprReviewStatus(hit, compact = false) {
            const status = String(hit.lpr_status || '').trim();
            if (!status) return '';
            const samples = Math.max(0, Number(hit.lpr_sample_count) || 0);
            const initialPlate = String(hit.lpr_initial_plate || '').trim();
            const finalPlate = String(hit.license_plate || '').trim();
            const corrected = status === 'verified' && initialPlate && finalPlate && initialPlate !== finalPlate;
            const sampleText = samples ? `${samples} เฟรม` : '';

            if (status === 'queued') {
                return `<span class="lpr-review-badge queued" title="พบรถแล้ว อยู่ในคิวรอวิเคราะห์ป้ายทะเบียน"><progress aria-label="รออ่านป้าย"></progress><span>${compact ? 'รออ่าน' : 'รออ่านป้าย'}</span></span>`;
            }
            if (status === 'reading') {
                return `<span class="lpr-review-badge reading" title="ระบบกำลังวิเคราะห์ภาพป้ายทะเบียน"><progress aria-label="กำลังอ่านป้าย"></progress><span>${compact ? 'กำลังอ่าน' : 'กำลังอ่านป้าย'}</span></span>`;
            }
            if (status === 'pending') {
                return `<span class="lpr-review-badge pending" title="ระบบกำลังอ่านซ้ำจากหลายเฟรมเพื่อความแม่นยำ"><progress aria-label="กำลังตรวจสอบ"></progress><span>${compact ? 'ตรวจซ้ำ' : `กำลังตรวจสอบ${sampleText ? ` · ${sampleText}` : ''}`}</span></span>`;
            }
            if (status === 'verified') {
                const correctionText = corrected && !compact
                    ? `<span class="lpr-correction">แก้จาก ${escapeHTML(initialPlate)}</span>`
                    : '';
                return `<span class="lpr-review-badge verified" title="ยืนยันผลอ่านป้ายทะเบียนเรียบร้อย"><i class="ri-checkbox-circle-fill"></i><span>${compact ? 'ยืนยันแล้ว' : `ยืนยันแล้ว${sampleText ? ` · ${sampleText}` : ''}`}</span>${correctionText}</span>`;
            }
            if (status === 'partial') {
                return `<span class="lpr-review-badge partial" title="อ่านได้เฉพาะตัวเลขหรือบางส่วนของป้าย ไม่ครบทั้งป้าย"><i class="ri-information-fill"></i><span>${compact ? 'ได้บางส่วน' : `ได้บางส่วน${sampleText ? ` · ${sampleText}` : ''}`}</span></span>`;
            }
            if (status === 'unreadable') {
                return `<span class="lpr-review-badge unreadable" title="ไม่สามารถอ่านตัวอักษรทะเบียนจากภาพได้"><i class="ri-eye-close-fill"></i><span>${compact ? 'อ่านไม่ได้' : 'อ่านป้ายไม่ได้'}</span></span>`;
            }
            return `<span class="lpr-review-badge uncertain" title="ผลจากหลายเฟรมยังไม่ตรงกัน หรือยังไม่สมบูรณ์ ควรตรวจภาพด้วยคน"><i class="ri-error-warning-fill"></i><span>${compact ? 'ควรตรวจ' : `ควรตรวจด้วยคน${sampleText ? ` · ${sampleText}` : ''}`}</span></span>`;
        }

        function renderWallCard(hit) {
            const rawName = (hit.name || "").trim();
            const hitImgUrl = safeMediaUrl(hit.full_url || hit.img_url);
            const plateImgUrl = safeMediaUrl(hit.plate_img_url);
            const badgeHtml = hit.is_color_edited ? `<span style="background: rgba(16,185,129,0.2); color: #10b981; border: 1px solid #10b981; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px;">✓ แก้ไขสี</span>` : '';

            const isLprOnly = rawName.includes("[LPR]") || rawName.startsWith("LPR");
            const isZoneAlert = rawName.includes("ในพื้นที่") || rawName.includes("วัตถุต้องสงสัย") || hit.detection_type === "zone_entry" || hit.detection_type === "zone_uncertain";
            const isLineAlert = rawName.includes("ข้ามเส้น") || hit.detection_type === "line_cross";
            const isGeneralPerson = rawName.includes("บุคคลทั่วไป") || rawName.toLowerCase().includes("person_");
            const isUnknownFallback = rawName.toLowerCase().includes("unknown");
            const isGeneralVehicle = rawName.startsWith("รถยนต์ทั่วไป") || rawName.startsWith("ยานพาหนะทั่วไป");
            const isPlateTarget = rawName.includes("ทะเบียนเป้าหมาย") || rawName.includes("💳");

            let targetBadge = '';
            let isTarget = false;

            if (isPlateTarget) {
                isTarget = true;
                targetBadge = `<span style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; box-shadow: 0 0 8px rgba(245,158,11,0.35);"><i class="ri-id-card-fill"></i> เป้าหมายทะเบียน</span>`;
            } else if (isZoneAlert) {
                isTarget = true;
                targetBadge = `<span style="background: linear-gradient(135deg, #a855f7, #ec4899); color: #ffffff; font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; box-shadow: 0 0 8px rgba(236,72,153,0.4);"><i class="ri-map-pin-user-fill"></i> Zone</span>`;
            } else if (isLineAlert) {
                isTarget = true;
                targetBadge = `<span style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #0f172a; font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem;"><i class="ri-crosshair-line"></i> Line</span>`;
            } else if (isGeneralPerson || isUnknownFallback) {
                isTarget = true;
                targetBadge = `<span style="background: linear-gradient(135deg, #06b6d4, #3b82f6); color: #ffffff; font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem;"><i class="ri-user-3-fill"></i> บุคคล</span>`;
            } else if (isLprOnly) {
                isTarget = false;
                targetBadge = `<span style="background: #334155; color: #94a3b8; font-weight: 700; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem;"><i class="ri-font-size-2"></i> ป้ายทะเบียน</span>`;
            } else if (isGeneralVehicle) {
                isTarget = false;
                targetBadge = `<span style="background: #334155; color: #94a3b8; font-weight: 700; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem;"><i class="ri-car-fill"></i> รถยนต์</span>`;
            } else {
                isTarget = true;
                targetBadge = `<span style="background: linear-gradient(135deg, #ef4444, #f43f5e); color: #ffffff; font-weight: 800; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; box-shadow: 0 0 8px rgba(244,63,94,0.4);"><i class="ri-focus-3-fill"></i> TARGET</span>`;
            }

            const hitId = Number(hit.id) || 0;
            const lprReviewHtml = renderLprReviewStatus(hit, true);

            return `
            <div class="wall-card ${isTarget ? 'target-alert' : ''}" data-hit-id="${hitId}">
                <div class="wall-card-head">
                    <div class="wall-card-title">
                        <span>${escapeHTML(hit.name)}</span>
                        ${badgeHtml}
                        ${targetBadge}
                        <span style="font-size: 0.75rem; color: #38bdf8; font-weight: 700;">(${Number(hit.confidence) || 0}%)</span>
                        ${lprReviewHtml}
                    </div>
                    <span class="wall-card-time"><i class="ri-time-line"></i> ${escapeHTML(formatTime(hit))}</span>
                </div>
                <div class="wall-media-wrap">
                    <img src="${hitImgUrl}" alt="เหตุการณ์ ${escapeHTML(hit.name)}" class="main-img" onclick="openZoomModal('${hitImgUrl}', '${escapeHTML(hit.name)}')" title="คลิกเพื่อดูภาพขนาดเต็ม">
                    ${plateImgUrl ? `
                    <div class="wall-plate-badge">
                        <span style="font-size: 0.65rem; color: #94a3b8; font-weight: 800; text-transform: uppercase;">Plate Crop</span>
                        <img src="${plateImgUrl}" alt="Crop ป้ายทะเบียน">
                        ${hit.license_plate ? `<span>${escapeHTML(hit.license_plate)}</span>` : ''}
                    </div>
                    ` : ''}
                </div>
            </div>`;
        }

        function renderWall() {
            const grid = document.getElementById('wall-grid');
            const countEl = document.getElementById('wall-count');
            if (!grid) return;

            const items = wallHits.filter(hit => matchesFilter(hit, wallFilter));

            if (countEl) {
                countEl.textContent = `${items.length} รายการ`;
            }

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1; padding: 80px 20px; text-align: center; color: #94a3b8; font-size: 1rem;">
                        <i class="ri-inbox-line" style="font-size: 2.5rem; display: block; margin-bottom: 10px; opacity: 0.6;"></i>
                        ไม่พบรายการตรวจจับในหมวดหมู่นี้
                    </div>`;
                return;
            }

            grid.innerHTML = items.map(renderWallCard).join('');
        }

        async function fetchWallHits() {
            try {
                let newHits = [];
                const response = await fetch(`${API_URL}/target_hits_page?limit=48`);
                if (response.ok) {
                    const data = await response.json();
                    newHits = Array.isArray(data.items) ? data.items : [];
                } else {
                    // Fallback to legacy hits endpoint
                    const legRes = await fetch(`${API_URL}/target_hits`);
                    if (legRes.ok) {
                        const legData = await legRes.json();
                        newHits = Array.isArray(legData) ? legData : [];
                    }
                }

                // Check if new target arrived to chime
                if (wallHits.length > 0 && newHits.length > 0 && newHits[0].id !== wallHits[0].id) {
                    const newest = newHits[0];
                    const rawName = (newest.name || "").trim();
                    const isTarget = rawName.includes("เป้าหมาย") || (!rawName.includes("[LPR]") && !rawName.startsWith("รถยนต์ทั่วไป"));
                    if (isTarget) {
                        playAlertSound();
                    }
                }

                wallHits = newHits;
                renderWall();
                document.getElementById('conn-status').innerHTML = `<i class="ri-checkbox-circle-fill"></i> สตรีมสดทำงานปกติ (${new Date().toLocaleTimeString('th-TH')})`;
                document.getElementById('conn-status').style.color = '#10b981';
            } catch (err) {
                console.error("Fetch error:", err);
                document.getElementById('conn-status').innerHTML = `<i class="ri-error-warning-fill"></i> ขาดการเชื่อมต่อกับเซิร์ฟเวอร์`;
                document.getElementById('conn-status').style.color = '#f43f5e';
            }
        }

        function openZoomModal(imgUrl, title) {
            const modal = document.getElementById('imageModal');
            const img = document.getElementById('modalImg');
            const t = document.getElementById('modalTitle');
            if (modal && img) {
                img.src = imgUrl;
                if (t) t.innerHTML = `<i class="ri-image-line" style="color: #38bdf8;"></i> ${title}`;
                modal.style.display = 'flex';
            }
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            if (modal) modal.style.display = 'none';
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeImageModal();
        });

        // Initialize & poll loop
        fetchWallHits();
        setInterval(fetchWallHits, 1500);
    </script>
</body>
</html>
